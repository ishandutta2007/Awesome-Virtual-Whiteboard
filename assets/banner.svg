<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><radialGradient id="glowViolet" cx="20%" cy="30%" r="50%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".25"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><radialGradient id="glowCyan" cx="80%" cy="70%" r="50%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".2"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="40%" stop-color="#e0e7ff"/><stop offset="75%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/></linearGradient><linearGradient id="cardGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#fde047"/></linearGradient><linearGradient id="cardGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fed7aa"/><stop offset="100%" stop-color="#fb923c"/></linearGradient><linearGradient id="cardGrad3" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a7f3d0"/><stop offset="100%" stop-color="#34d399"/></linearGradient><pattern id="dotGrid" width="30" height="30" x="0" y="0" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#334155" fill-opacity=".45"/></pattern><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".4" stdDeviation="12"/></filter><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatSlow1{0%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(-1deg)}}@keyframes floatSlow2{0%{transform:translateY(0) rotate(4deg)}50%{transform:translateY(-18px) rotate(6deg)}}@keyframes floatSlow3{0%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(0deg)}}@keyframes cursorMove1{0%{transform:translate(0,0)}50%{transform:translate(25px,-15px)}}@keyframes cursorMove2{0%{transform:translate(0,0)}50%{transform:translate(-30px,12px)}}@keyframes pulseGlow{0%{opacity:.6}50%{opacity:.9}}.floating-card-1{animation:floatSlow1 7s ease-in-out infinite}.floating-card-2{animation:floatSlow2 8.5s ease-in-out infinite}.floating-card-3{animation:floatSlow3 6.5s ease-in-out infinite}.cursor-anim-1{animation:cursorMove1 5s ease-in-out infinite}.cursor-anim-2{animation:cursorMove2 6s ease-in-out infinite}.flow-line{stroke-dasharray:8 6;animation:dashFlow 2.5s linear infinite}.pulsing-aura{animation:pulseGlow 4s ease-in-out infinite}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#dotGrid)" rx="16"/><rect width="1200" height="420" fill="url(#glowViolet)" class="pulsing-aura" rx="16"/><rect width="1200" height="420" fill="url(#glowCyan)" class="pulsing-aura" rx="16"/><g opacity=".5"><path fill="none" stroke="#a78bfa" stroke-width="2.5" d="M 170 120 C 260 80, 320 180, 420 140" class="flow-line"/><path fill="none" stroke="#38bdf8" stroke-width="2.5" d="M 780 290 C 880 320, 950 220, 1030 260" class="flow-line"/></g><g class="floating-card-1" style="transform-origin:140px 140px"><g filter="url(#shadow)"><rect width="140" height="120" x="70" y="80" fill="url(#cardGrad1)" rx="8"/><rect width="90" height="8" x="85" y="100" fill="#854d0e" opacity=".6" rx="4"/><rect width="110" height="6" x="85" y="118" fill="#854d0e" opacity=".4" rx="3"/><rect width="75" height="6" x="85" y="132" fill="#854d0e" opacity=".4" rx="3"/><text x="85" y="175" fill="#713f12" font-family="system-ui, sans-serif" font-size="13" font-weight="700">💡 Ideate</text></g></g><g class="floating-card-2" style="transform-origin:1050px 270px"><g filter="url(#shadow)"><rect width="150" height="130" x="980" y="210" fill="url(#cardGrad2)" rx="8"/><rect width="100" height="8" x="998" y="230" fill="#9a3412" opacity=".6" rx="4"/><rect width="115" height="6" x="998" y="248" fill="#9a3412" opacity=".4" rx="3"/><rect width="80" height="6" x="998" y="262" fill="#9a3412" opacity=".4" rx="3"/><text x="998" y="310" fill="#7c2d12" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🚀 Collaborate</text></g></g><g class="floating-card-3" style="transform-origin:1060px 100px"><g filter="url(#shadow)"><rect width="130" height="110" x="1000" y="60" fill="url(#cardGrad3)" rx="8"/><rect width="80" height="8" x="1015" y="80" fill="#065f46" opacity=".6" rx="4"/><rect width="95" height="6" x="1015" y="98" fill="#065f46" opacity=".4" rx="3"/><text x="1015" y="142" fill="#064e3b" font-family="system-ui, sans-serif" font-size="13" font-weight="700">📐 Wireframe</text></g></g><g class="cursor-anim-1"><path fill="#ec4899" stroke="#fff" stroke-width="1.5" d="M 230 200 L 230 218 L 235 214 L 241 224 L 245 222 L 239 212 L 247 212 Z"/><rect width="48" height="20" x="245" y="215" fill="#ec4899" rx="4"/><text x="251" y="229" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Alex</text></g><g class="cursor-anim-2"><path fill="#06b6d4" stroke="#fff" stroke-width="1.5" d="M 940 160 L 940 178 L 945 174 L 951 184 L 955 182 L 949 172 L 957 172 Z"/><rect width="48" height="20" x="955" y="175" fill="#06b6d4" rx="4"/><text x="961" y="189" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Liam</text></g><g filter="url(#shadow)"><rect width="700" height="250" x="250" y="85" fill="#0b1120" fill-opacity=".82" stroke="#334155" stroke-width="1.5" rx="20"/></g><g><rect width="210" height="28" x="495" y="112" fill="#1e293b" stroke="#6366f1" stroke-width="1" rx="14"/><circle cx="510" cy="126" r="4" fi
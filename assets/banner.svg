<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <radialGradient id="glowViolet" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e7ff" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Canvas Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#334155" fill-opacity="0.45" />
    </pattern>

    <!-- Card Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(-3deg); }
        50% { transform: translateY(-14px) rotate(-1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(4deg); }
        50% { transform: translateY(-18px) rotate(6deg); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px) rotate(-2deg); }
        50% { transform: translateY(-10px) rotate(0deg); }
      }
      @keyframes cursorMove1 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(25px, -15px); }
      }
      @keyframes cursorMove2 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-30px, 12px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.9; }
      }

      .floating-card-1 { animation: floatSlow1 7s ease-in-out infinite; }
      .floating-card-2 { animation: floatSlow2 8.5s ease-in-out infinite; }
      .floating-card-3 { animation: floatSlow3 6.5s ease-in-out infinite; }
      .cursor-anim-1 { animation: cursorMove1 5s ease-in-out infinite; }
      .cursor-anim-2 { animation: cursorMove2 6s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 8 6; animation: dashFlow 2.5s linear infinite; }
      .pulsing-aura { animation: pulseGlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Whiteboard Dot Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#dotGrid)" />

  <!-- Ambient Glows -->
  <rect width="1200" height="420" rx="16" fill="url(#glowViolet)" class="pulsing-aura" />
  <rect width="1200" height="420" rx="16" fill="url(#glowCyan)" class="pulsing-aura" />

  <!-- BACKGROUND DECORATIVE ELEMENTS: Floating Sticky Notes & Flows -->
  <!-- Connector Lines -->
  <g opacity="0.5">
    <path d="M 170 120 C 260 80, 320 180, 420 140" fill="none" stroke="#a78bfa" stroke-width="2.5" class="flow-line" />
    <path d="M 780 290 C 880 320, 950 220, 1030 260" fill="none" stroke="#38bdf8" stroke-width="2.5" class="flow-line" />
  </g>

  <!-- Sticky Note Left Top -->
  <g class="floating-card-1" style="transform-origin: 140px 140px;">
    <g filter="url(#shadow)">
      <rect x="70" y="80" width="140" height="120" rx="8" fill="url(#cardGrad1)" />
      <rect x="85" y="100" width="90" height="8" rx="4" fill="#854d0e" opacity="0.6" />
      <rect x="85" y="118" width="110" height="6" rx="3" fill="#854d0e" opacity="0.4" />
      <rect x="85" y="132" width="75" height="6" rx="3" fill="#854d0e" opacity="0.4" />
      <text x="85" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#713f12">💡 Ideate</text>
    </g>
  </g>

  <!-- Sticky Note Right Bottom -->
  <g class="floating-card-2" style="transform-origin: 1050px 270px;">
    <g filter="url(#shadow)">
      <rect x="980" y="210" width="150" height="130" rx="8" fill="url(#cardGrad2)" />
      <rect x="998" y="230" width="100" height="8" rx="4" fill="#9a3412" opacity="0.6" />
      <rect x="998" y="248" width="115" height="6" rx="3" fill="#9a3412" opacity="0.4" />
      <rect x="998" y="262" width="80" height="6" rx="3" fill="#9a3412" opacity="0.4" />
      <text x="998" y="310" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7c2d12">🚀 Collaborate</text>
    </g>
  </g>

  <!-- Sticky Note Right Top -->
  <g class="floating-card-3" style="transform-origin: 1060px 100px;">
    <g filter="url(#shadow)">
      <rect x="1000" y="60" width="130" height="110" rx="8" fill="url(#cardGrad3)" />
      <rect x="1015" y="80" width="80" height="8" rx="4" fill="#065f46" opacity="0.6" />
      <rect x="1015" y="98" width="95" height="6" rx="3" fill="#065f46" opacity="0.4" />
      <text x="1015" y="142" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#064e3b">📐 Wireframe</text>
    </g>
  </g>

  <!-- Multiplayer Cursor 1 (Alex - Pink) -->
  <g class="cursor-anim-1">
    <path d="M 230 200 L 230 218 L 235 214 L 241 224 L 245 222 L 239 212 L 247 212 Z" fill="#ec4899" stroke="#ffffff" stroke-width="1.5" />
    <rect x="245" y="215" width="48" height="20" rx="4" fill="#ec4899" />
    <text x="251" y="229" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Alex</text>
  </g>

  <!-- Multiplayer Cursor 2 (Liam - Cyan) -->
  <g class="cursor-anim-2">
    <path d="M 940 160 L 940 178 L 945 174 L 951 184 L 955 182 L 949 172 L 957 172 Z" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" />
    <rect x="955" y="175" width="48" height="20" rx="4" fill="#06b6d4" />
    <text x="961" y="189" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Liam</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Plate & Typography -->
  <!-- Centered Translucent Backdrop Shield to Guarantee Contrast & Visibility -->
  <g filter="url(#shadow)">
    <rect x="250" y="85" width="700" height="250" rx="20" fill="#0b1120" fill-opacity="0.82" stroke="#334155" stroke-width="1.5" />
  </g>

  <!-- Top Decorative Badge -->
  <g>
    <rect x="495" y="112" width="210" height="28" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
    <circle cx="510" cy="126" r="4" fill="#22c55e" />
    <text x="522" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe" letter-spacing="1">CURATED ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-0.5">
    Awesome Virtual Whiteboard
  </text>

  <!-- Subtitle -->
  <text x="600" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Collaborative Canvases • Real-Time Visual Workspaces • Diagrams &amp; Sketching
  </text>

  <!-- Pill Tags Row -->
  <g transform="translate(320, 268)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="120" height="30" rx="15" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <text x="60" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc" text-anchor="middle">⚡ Real-Time</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(132, 0)">
      <rect x="0" y="0" width="138" height="30" rx="15" fill="#0f2b38" stroke="#0891b2" stroke-width="1" />
      <text x="69" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#67e8f9" text-anchor="middle">♾️ Infinite Canvas</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(282, 0)">
      <rect x="0" y="0" width="138" height="30" rx="15" fill="#142c26" stroke="#059669" stroke-width="1" />
      <text x="69" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7" text-anchor="middle">🔓 Open-Source</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(432, 0)">
      <rect x="0" y="0" width="128" height="30" rx="15" fill="#2d1537" stroke="#9333ea" stroke-width="1" />
      <text x="64" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e9d5ff" text-anchor="middle">💼 SaaS Suites</text>
    </g>
  </g>
</svg>
